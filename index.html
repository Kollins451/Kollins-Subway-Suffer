
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#101a2b">
  <title>Kollins Runner — 3D Subway Edition</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <div id="game-root">
    <div id="hud" aria-live="polite">
      <div class="hud-card score-card">
        <small>SCORE</small>
        <strong id="score-val">0</strong>
      </div>

      <div class="hud-card coin-card">
        <small>COINS</small>
        <strong>
          <span class="coin-icon">●</span>
          <span id="coin-val">0</span>
        </strong>
      </div>

      <div class="hud-card best-card">
        <small>BEST</small>
        <strong id="best-val">0</strong>
      </div>
    </div>

    <div id="status-chip" class="hidden">READY</div>

    <div id="menu-screen" class="screen">
      <div class="brand-mark">KR<span>3D</span></div>
      <p class="eyebrow">KOLLINS RUNNER</p>

      <h1>RUN THE<br><span>RAILWAY.</span></h1>

      <p class="menu-copy">
        Dodge trains. Collect coins. Beat your best run.
      </p>

      <button id="play-btn" class="primary-btn">
        ▶ START RUN
      </button>

      <div class="menu-stats">
        BANKED COINS
        <strong id="banked-coins">0</strong>
      </div>

      <div class="menu-controls">
        ← → / A D MOVE
        <span>↑ / SPACE JUMP</span>
        <span>↓ SLIDE</span>
      </div>
    </div>

    <div id="pause-screen" class="screen hidden">
      <p class="eyebrow">RUN PAUSED</p>
      <h2>Take a breath.</h2>

      <button id="resume-btn" class="primary-btn">
        ▶ RESUME
      </button>

      <button id="menu-btn" class="secondary-btn">
        QUIT RUN
      </button>
    </div>

    <div id="gameover-screen" class="screen hidden">
      <p class="eyebrow">RUN COMPLETE</p>
      <h1>WIPEOUT</h1>

      <p id="gameover-message">Score: 0</p>

      <button id="retry-btn" class="primary-btn">
        ↻ RUN AGAIN
      </button>

      <button id="gameover-menu-btn" class="secondary-btn">
        MAIN MENU
      </button>
    </div>

    <div id="mobile-controls" class="hidden" aria-label="Touch controls">
      <div class="move-pad">
        <button data-action="left" aria-label="Move left">‹</button>
        <button data-action="right" aria-label="Move right">›</button>
      </div>

      <div class="action-pad">
        <button data-action="slide" aria-label="Slide">↓</button>
        <button data-action="jump" aria-label="Jump">↑</button>
      </div>
    </div>

    <button id="pause-btn" class="pause-btn hidden" aria-label="Pause game">
      Ⅱ
    </button>

    <div id="controls-hint">
      ARROWS / A D MOVE · SPACE / ↑ JUMP · ↓ SLIDE · P PAUSE
    </div>

    <div id="toast" class="hidden"></div>
  </div>
</body>
</html>
