<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Subway Surfers Web Edition</title>
    <!-- Core Three.js Graphics Library -->
    <script src="https://cloudflare.com"></script>
    <style>
        /* ==========================================
           CORE LAYOUT & INTERFACE RESET
           ========================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #5c940d;
            font-family: 'Arial Black', Gadget, sans-serif;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        /* Top Navigation HUD */
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
        }
        .hud-box {
            background: rgba(0, 0, 0, 0.65);
            padding: 10px 20px;
            border-radius: 8px;
            border: 2px solid #fff;
            font-size: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        #score-box { color: #00ffcc; }
        #coin-box { color: #ffd700; }
        
        /* Power-up Timer Progress Bars */
        #active-powerups {
            position: absolute;
            top: 90px;
            left: 20px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 200px;
            pointer-events: none;
        }
        .powerup-bar {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #fff;
            border-radius: 4px;
            padding: 5px;
            font-size: 11px;
            color: #fff;
        }
        .progress-fill {
            height: 8px;
            background: #00ffcc;
            width: 100%;
            margin-top: 4px;
            border-radius: 2px;
            transition: width 0.1s linear;
        }
        /* State Screen Modals */
        .modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            background: rgba(0,0,0,0.75);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            text-align: center;
            padding: 20px;
        }
        h1 {
            font-size: 44px;
            margin-bottom: 15px;
            letter-spacing: 2px;
            text-shadow: 0 4px 0 #000;
        }
        .main-menu h1 { color: #ffcc00; }
        .game-over h1 { color: #ff3333; }
        p {
            font-size: 18px;
            margin-bottom: 30px;
            color: #ddd;
        }
        button {
            background: #ffcc00;
            color: #000;
            border: none;
            padding: 15px 40px;
            font-size: 22px;
            font-weight: bold;
            font-family: 'Arial Black', sans-serif;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 0 #b38f00;
            transition: transform 0.1s;
        }
        button:active {
            transform: scale(0.95) translateY(5px);
            box-shadow: none;
        }
        .hidden { display: none !important; }
        
        #controls-hint {
            position: absolute;
            bottom: 15px;
            width: 100%;
            text-align: center;
            color: rgba(255,255,255,0.6);
            font-size: 12px;
            z-index: 5;
            pointer-events: none;
            font-family: sans-serif;
        }
    </style>
</head>
<body>

    <!-- Heads Up Display Engine Layer -->
    <div id="hud">
        <div id="score-box" class="hud-box">SCORE: <span id="score-val">0</span></div>
        <div id="coin-box" class="hud-box">🪙 <span id="coin-val">0</span></div>
    </div>

    <!-- Power-Up UI Timer Bars Container -->
    <div id="active-powerups">
        <div id="magnet-timer" class="powerup-bar hidden">
            MAGNET ACTIVE
            <div id="magnet-progress" class="progress-fill" style="background: #ffd700;"></div>
        </div>
        <div id="jetpack-timer" class="powerup-bar hidden">
            JETPACK ACTIVE
            <div id="jetpack-progress" class="progress-fill" style="background: #00ffcc;"></div>
        </div>
        <div id="board-timer" class="powerup-bar hidden">
            HOVERBOARD SHIELD ACTIVE
            <div id="board-progress" class="progress-fill" style="background: #ff3399;"></div>
        </div>
    </div>

    <!-- Screen State 1: Main Startup Menu -->
    <div id="menu-screen" class="modal main-menu">
        <h1>SUBWAY SURFERS</h1>
        <p>Web Template Edition</p>
        <button onclick="startGame()">TAP TO PLAY</button>
        <div style="margin-top:20px; font-size:14px; color:#aaa;">TOTAL BANKED COINS: <span id="banked-coins">0</span></div>
    </div>

    <!-- Screen State 2: Game Over Menu Screen -->
    <div id="gameover-screen" class="modal game-over hidden">
        <h1>CAUGHT!</h1>
        <p>The Inspector and his dog cornered you.</p>
        <button onclick="resetGame()">RUN AGAIN</button>
    </div>

    <div id="controls-hint">Desktop: A/D or Arrows to Move | W/Space to Jump | S to Slide | Double Click / E to deploy Hoverboard</div>

    <!-- ========================================== -->
    <!-- JAVASCRIPT GAME ENGINE PRODUCTION LAYER    -->
    <!-- ========================================== -->
    <script>
        let scene, camera, renderer;
        let player, chaser;
        let currentLane = 0; 
        const laneWidth = 3.3;
        
        let obstacles = [];
        let coins = [];
        let sceneryItems = [];

        let score = 0;
        let sessionCoins = 0;
        let scoreMultiplier = 1;
        let gameActive = false;
        let speed = 0.28;
        const maxSpeed = 0.85;

        let isJumping = false;
        let isSliding = false;
        let yVelocity = 0;
        const gravity = 0.016;
        const jumpForce = 0.38;

        let isHoverboardActive = false;
        let isMagnetActive = false;
        let isJetpackActive = false;
        let chaserDistance = 6.0; 

        let timers = { magnet: null, jetpack: null, board: null };
        let spawnTimeoutRef = null;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xa3e2f7); 
            scene.fog = new THREE.FogExp2(0xa3e2f7, 0.009);

            camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5.5, 7.5);
            camera.lookAt(0, 2, -4);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
            scene.add(ambientLight);
            const sunLight = new THREE.DirectionalLight(0xffffff, 0.85);
            sunLight.position.set(15, 40, 20);
            scene.add(sunLight);

            buildSubwayGridEnvironment();
            buildPlayerModelCharacter();
            buildInspectorChaserModel();

            window.addEventListener('keydown', handleKeyboardControls);
            setupTouchSwipeControls();
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('dblclick', () => { if(gameActive) activateHoverboard(); });

            document.getElementById('banked-coins').innerText = localStorage.getItem('subway_total_coins') || 0;
        }

        function buildSubwayGridEnvironment() {
            const bedGeo = new THREE.PlaneGeometry(16, 3000);
            const bedMat = new THREE.MeshStandardMaterial({ color: 0x3a3a3a, roughness: 0.9 });
            const bedMesh = new THREE.Mesh(bedGeo, bedMat);
            bedMesh.rotation.x = -Math.PI / 2;
            bedMesh.position.z = -1000;
            scene.add(bedMesh);

            for (let i = -1; i <= 1; i++) {
                const railLineGeo = new THREE.BoxGeometry(0.25, 0.15, 3000);
                const railLineMat = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.7 });
                const rail = new THREE.Mesh(railLineGeo, railLineMat);
                rail.position.set(i * laneWidth, 0.075, -1000);
                scene.add(rail);
            }

            for (let z = 0; z > -1500; z -= 45) {
                spawnSideSceneryPillars(z);
            }
        }

        function spawnSideSceneryPillars(zPos) {
            const wallGeo = new THREE.BoxGeometry(1.5, 8, 10);
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x7a6350 });
            
            const leftWall = new THREE.Mesh(wallGeo, wallMat);
            leftWall.position.set(-11, 4, zPos);
            scene.add(leftWall);
            sceneryItems.push(leftWall);

            const rightWall = leftWall.clone();
            rightWall.position.x = 11;
            scene.add(rightWall);
            sceneryItems.push(rightWall);
        }

        function buildPlayerModelCharacter() {
            player = new THREE.Group();
