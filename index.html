<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Subway Surfers Web Edition</title>

<!-- FIXED THREE.JS LIBRARY -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#5c940d;
    font-family:Arial Black,sans-serif;
}


canvas{
    display:block;
    position:absolute;
    width:100%;
    height:100%;
    top:0;
    left:0;
    z-index:1;
}


#hud{
    position:absolute;
    top:20px;
    left:20px;
    right:20px;
    z-index:10;
    display:flex;
    justify-content:space-between;
}


.hud-box{

    background:rgba(0,0,0,.65);
    color:white;
    padding:10px 20px;
    border-radius:8px;
    border:2px solid white;
    font-size:20px;

}


#score-box{
    color:#00ffcc;
}


#coin-box{
    color:#ffd700;
}


.modal{

    position:absolute;
    width:100%;
    height:100%;
    top:0;
    left:0;
    z-index:20;

    background:rgba(0,0,0,.75);

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    color:white;
    text-align:center;

}


h1{

    font-size:44px;
    color:#ffcc00;
    text-shadow:0 4px 0 black;

}


p{

    margin:20px;
    font-size:18px;

}


button{

    background:#ffcc00;
    color:black;

    border:none;

    padding:15px 40px;

    border-radius:50px;

    font-size:22px;

    font-weight:bold;

    cursor:pointer;

}


button:active{

    transform:scale(.95);

}


.hidden{

display:none !important;

}

</style>

</head>


<body>


<div id="hud">

<div id="score-box" class="hud-box">
SCORE:
<span id="score-val">0</span>
</div>


<div id="coin-box" class="hud-box">
🪙
<span id="coin-val">0</span>
</div>

</div>



<div id="menu-screen" class="modal">

<h1>
SUBWAY SURFERS
</h1>


<p>
Web Edition
</p>


<button id="play-btn">
TAP TO PLAY
</button>


</div>



<div id="gameover-screen" class="modal hidden">

<h1>
CAUGHT!
</h1>


<p>
Game Over
</p>


<button id="retry-btn">
RUN AGAIN
</button>


</div>


<canvas id="gameCanvas"></canvas>


<script>

let scene;
let camera;
let renderer;

let gameActive=false;


function init(){


scene=new THREE.Scene();


camera=new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
0.1,
1000
);


camera.position.z=5;



renderer=new THREE.WebGLRenderer({
canvas:document.getElementById("gameCanvas")
});


renderer.setSize(
window.innerWidth,
window.innerHeight
);



let light=new THREE.AmbientLight(
0xffffff
);

scene.add(light);



let geometry=new THREE.BoxGeometry(
1,
1,
1
);


let material=new THREE.MeshBasicMaterial({
color:0x00ff00
});


let cube=new THREE.Mesh(
geometry,
material
);


scene.add(cube);



animate();


}




function animate(){

requestAnimationFrame(animate);


if(gameActive){

}


renderer.render(
scene,
camera
);


}




function startGame(){

document.getElementById("menu-screen")
.classList.add("hidden");


gameActive=true;


}




function resetGame(){

document.getElementById("gameover-screen")
.classList.add("hidden");


startGame();

}




document.addEventListener(
"DOMContentLoaded",
()=>{


document.getElementById("play-btn")
.addEventListener(
"click",
startGame
);



document.getElementById("retry-btn")
.addEventListener(
"click",
resetGame
);



init();


}

);


</script>


</body>
</html>
